spring.application.name=appointment-tests
spring.datasource.url=jdbc:h2:mem:appointment_${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always

# Preserve the explicit shared SQL schema during tests.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
