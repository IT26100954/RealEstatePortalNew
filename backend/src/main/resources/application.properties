spring.application.name=real-estate-portal
server.port=8081

# Supports launching from either the repository root or backend directory.
# This ignored local file is Java properties syntax; it is not a shell script.
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/real_estate_portal_new}
spring.datasource.username=${DB_USER:portal_new_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
